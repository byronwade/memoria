name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Matrix tests the PUBLISHED package across the Node versions its
  # engines field supports (>=18). It is scoped to @byronwade/memoria so the
  # Node-20-only Next.js web app isn't built on Node 18. The full monorepo
  # build (web + api + mcp-server) is covered by the `lint` job below on Node 20.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build -w @byronwade/memoria
      - run: npm test -w @byronwade/memoria

  # Builds every workspace (incl. the Next.js web app, which requires Node 20+).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
